name: Refresh Google Scholar citations
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scholar.yml'
      - 'scripts/update_scholar.py'
permissions:
  contents: write
  pages: write
concurrency:
  group: scholar-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            index.html
            scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified public profile once
        run: python scripts/update_scholar.py
      - name: Commit snapshot and request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified Google Scholar citation snapshot'
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN pushes do not trigger Pages automatically.
          gh api --method POST repos/${{ github.repository }}/pages/builds
